name: Backend CI

# Faz 7.2 — backend/'i etkileyen her push/PR'da çalışır. İki ayrı iş (job):
#   - `lint-and-unit`  : hiçbir dış servise ihtiyaç duymaz, her zaman hızlıdır.
#   - `e2e`            : gerçek Postgres/Redis `services:` container'larıyla
#                         `/health` uçlarını uçtan uca doğrular (bkz.
#                         `backend/test/health.e2e-spec.ts`).
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-unit:
    name: Lint + Derleme + Birim Testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      # NOT: depoda henüz bir package-lock.json yok (bkz. kök README), bu
      # yüzden `npm ci` yerine `npm install` kullanılıyor — lockfile
      # eklendiğinde bu adımı `npm ci` olarak değiştirmek build'i hem
      # hızlandırır hem deterministik hale getirir.
      - name: Bağımlılıkları kur
        run: npm install

      - name: Prisma Client üret
        run: npx prisma generate

      - name: Lint
        run: npm run lint -- --max-warnings=9999

      - name: TypeScript derlemesi
        run: npm run build

      - name: Birim testleri
        run: npm test -- --ci --passWithNoTests

  e2e:
    name: E2E Testleri (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vyron_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      API_PREFIX: api
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vyron_ci?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      JWT_ACCESS_SECRET: ci_test_access_secret_min_32_characters_long
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci_test_refresh_secret_min_32_characters_long
      JWT_REFRESH_EXPIRES_IN: 30d
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: auto
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: vyron-ci-media
      S3_PUBLIC_URL: http://localhost:9000/vyron-ci-media
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_USER: ci
      SMTP_PASSWORD: ci
      MAIL_FROM: no-reply@vyron.ci
      RATE_LIMIT_TTL: '60'
      RATE_LIMIT_MAX: '1000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Bağımlılıkları kur
        run: npm install

      - name: Prisma Client üret
        run: npx prisma generate

      - name: Migration'ları uygula
        run: npx prisma migrate deploy

      - name: E2E testleri
        run: npm run test:e2e -- --ci
