name: Docker Yayınla (Backend)

# Faz 7.2 - main'e her push'ta VE her `v*` tag'inde backend imajini
# GitHub Container Registry'ye (ghcr.io) build edip yayinlar. Ekstra bir
# secret gerekmez - `GITHUB_TOKEN` otomatik olarak saglanir (repo
# Settings > Actions > General'da "Read and write permissions" acik olmali).
#
# Yayinlanan imaj: ghcr.io/<owner>/<repo>-backend:<tag>
#   - main'e push  -> :latest ve :sha-<kisa-commit>
#   - v1.2.3 tag'i -> :1.2.3, :1.2, :1 ve :latest
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/docker-publish.yml'
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    name: Build ve Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@v3

      - name: GHCR'a giris yap
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imaj meta verisi (etiketler)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build ve push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
