server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: bilinmeyen tüm yollar index.html'e düşer, React Router
    # (BrowserRouter) client-side olarak eşleştirir.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~* \.(js|css|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
