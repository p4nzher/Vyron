name: vyron
description: "Vyron - Discord'dan ilham alan, tamamen ozgun tasarim ve mimariye sahip modern iletisim platformu."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  go_router: ^14.2.7

  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  socket_io_client: ^2.0.3+1

  livekit_client: ^2.2.1
  permission_handler: ^11.3.1

  flutter_secure_storage: ^9.2.2

  qr_flutter: ^4.1.0

  shared_preferences: ^2.2.3

  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  get_it: ^7.7.0

  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  file_picker: ^11.0.2

  google_fonts: ^6.2.1

  intl: ^0.19.0
  equatable: ^2.0.5
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  emoji_picker_flutter: ^3.1.0
  record: ^6.2.1
  just_audio: ^0.9.40
  flutter_local_notifications: ^17.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

